<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDoK8s</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./config.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>ToDoK8s</h1>
        <p class="subtitle">Минимальный Todo workload для практики DevOps.</p>

        <form id="todo-form" class="todo-form">
          <label class="sr-only" for="todo-input">Новая задача</label>
          <input
            id="todo-input"
            name="text"
            type="text"
            maxlength="200"
            placeholder="Например: поднять docker compose"
            required
          />
          <button type="submit">Добавить</button>
        </form>

        <p id="status" class="status" aria-live="polite">Загрузка...</p>

        <ul id="todo-list" class="todo-list"></ul>
      </section>
    </main>
  </body>
</html>
