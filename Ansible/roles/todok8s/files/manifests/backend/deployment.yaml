apiVersion: apps/v1
kind: Deployment

metadata:
  name: todo-backend
  namespace: todok8s

spec:
  replicas: 2

  selector:
    matchLabels:
      app: todo-backend

  template:
    metadata:
      labels:
        app: todo-backend

    spec:
      containers:
        - name: backend
          image: nginx:1.27

          ports:
            - containerPort: 80